name: Django
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - name: Запуск сервера и проверка /health/ в PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList 'manage.py','runserver','127.0.0.1:8000','--noreload' -PassThru
          try {
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              try {
                $reply = Invoke-RestMethod http://127.0.0.1:8000/health/
                break
              } catch {
                if ($server.HasExited -or $attempt -eq 15) { throw }
                Start-Sleep -Seconds 1
              }
            }
            if ($reply.Trim() -ne 'ok') { throw 'Unexpected health response' }
          } finally {
            Stop-Process -Id $server.Id
          }
      - name: Учебные сценарии в Chromium
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python manage.py test tests.ui.learning
